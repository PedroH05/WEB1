<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Exercicio B</h1>
        <nav>
            <a href="ex01.html"><button>Pagina 1</button></a>
        </nav>
    </header>
    <hr>

    <form action="">
        <p>
            <label for="Nome">Nome: </label>    
            <input type="nome" id="nome">  
        </p>
        <p>
            <label for="data_nascimento">Data de nascimento: </label>
            <input type="month" name="data_nascimento" id="data_nascimento">
        </p>
        <p>
            <label for="sexo">Sexo: </label>
            <select name="sexo" id="sexo">
            <option value="0" disabled selected>Escolha uma opção</option>
            <option value="M">Mulher</option>
            <option value="H">Homem</option>
            <option value="">Prefiro nao responder</option>
            </select>
        </p>
        <p>
            <label for="endereço">Endereço: </label>
            <input type="" name="endereço" id="endereço">
        </p>
        <p>
            <label for="estado">Selecione o seu estado: </label>
            <select name="estado" id="estado">
            <option value="0" disabled selected>Escolha uma opção</option>
            <option value="SP">São Paulo</option>
            <option value="SC">Santa Catarina</option>
            <option value="MG">Minas Gerais</option>
            </select>
        </p>
        <p>
            <label for="cidade">Selecione o seu estado: </label>
            <select name="cidade" id="cidade">
            <option value="0" disabled selected>Escolha uma opção</option>
            <option value="">Taubaté</option>
            <option value="">São josé</option>
            <option value="">Campos do jordão</option>
            </select>
        </p>
        <p>
            <label for="email">Email: </label>
            <input type="text" name="email" id="email">
        </p>
        <p>
            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" id="telefone">
        </p>
        <p>
            <label for="area">Area(s) de interesse</label>
            <select name="area" id="area">
            <option value="0" disabled selected>Escolha uma opção</option>
            <option value="">Computação</option>
            <option value="">Engenharia</option>
            <option value="">História</option>
            </select>
        </p>
        <p>
            <label for="usuario">Digite seu usuario: </label>
            <input type="text" name="usuario" id="usuario">
        </p>
        <p>
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha">
        </p>
        <p>
            <input type="submit" value="Enviar dados">
        </p>

    </form>

</body>
</html>
